spring.application.name=ecommerce-backend

server.port=8081

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
# IMPORTANT: Override in production via env var JWT_SECRET. The value below is a
# development-only placeholder; JwtUtil.init() fails startup if a weak secret is supplied.
jwt.secret=${JWT_SECRET:5oQPg922G0sfNMZKpeoSlkPgknkAFZJQazlyHmzMxtsIFS46kHOoFsYDIC8pK0UX}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.upload.base-url=http://localhost:8081/uploads/

# Khalti ePayment (KPG-2) – set via env KHALTI_SECRET_KEY (test-admin.khalti.com live_secret_key)
khalti.secret-key=${KHALTI_SECRET_KEY}
khalti.mode=${KHALTI_MODE:sandbox}
khalti.sandbox-url=https://dev.khalti.com/api/v2/
khalti.prod-url=https://khalti.com/api/v2/
khalti.timeout-ms=10000
app.payment.return-url=${APP_RETURN_URL:http://localhost:3000/payment/callback}
app.payment.website-url=${APP_WEBSITE_URL:http://localhost:3000}

# eSewa ePay v2 – test defaults (EPAYTEST). Override via env in production.
esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
esewa.secret-key=${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
esewa.mode=${ESEWA_MODE:test}
esewa.test-gateway-url=https://rc-epay.esewa.com.np/api/epay/main/v2/form
esewa.prod-gateway-url=https://epay.esewa.com.np/api/epay/main/v2/form
esewa.test-status-url=https://rc-epay.esewa.com.np/api/epay/transaction/status/
esewa.prod-status-url=https://epay.esewa.com.np/api/epay/transaction/status/
esewa.success-url=${ESEWA_SUCCESS_URL:${app.payment.website-url:http://localhost:3000}/esewa/callback}
esewa.failure-url=${ESEWA_FAILURE_URL:${app.payment.website-url:http://localhost:3000}/esewa/callback}
esewa.timeout-ms=10000

# Logging
logging.level.root=INFO
logging.level.com.ecommerce.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
