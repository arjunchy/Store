spring.application.name=ecommerce-backend

server.port=8081

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
# IMPORTANT: Override in production via env var JWT_SECRET. The value below is a
# development-only placeholder; JwtUtil.init() fails startup if a weak secret is supplied.
jwt.secret=${JWT_SECRET:5oQPg922G0sfNMZKpeoSlkPgknkAFZJQazlyHmzMxtsIFS46kHOoFsYDIC8pK0UX}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/
app.upload.base-url=http://localhost:8081/uploads/

# Logging
logging.level.root=INFO
logging.level.com.ecommerce.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
